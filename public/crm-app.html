<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Savvy Swim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --chrome:#8E1F2C;--chrome2:#6E1620;
  --surface:#F4EFE3;--card:#FFFFFF;--elev:#FAF6EC;
  --ink:#1C2A33;--ink2:#54646E;--ink3:#8C9AA1;
  --brand:#8E1F2C;--brand-d:#6E1620;--teal:#1FA9BE;
  --gold:#F5B82E;--violet:#8B7BE0;--pink:#D42B33;--sky:#2E7FC2;
  --ok:#188A54;--ok-bg:#E3F4EA;
  --warn:#B87709;--warn-bg:#FCF0D8;
  --err:#C0303B;--err-bg:#FBE7E8;
  --line:#EAE2D3;--line2:#D9CDB8;
  --r:12px;--sh:0 1px 2px rgba(93,74,42,.06),0 2px 10px rgba(93,74,42,.07);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--surface);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;line-height:1.45;padding-bottom:calc(64px + env(safe-area-inset-bottom));font-feature-settings:"tnum";}
.wrap{max-width:560px;margin:0 auto;padding:0 14px;}
.appbar{background:rgba(255,253,248,.94);backdrop-filter:blur(14px);color:var(--ink);position:sticky;top:0;z-index:50;}
.appbar::after{content:"";display:block;height:7px;background:repeating-linear-gradient(90deg,#8E1F2C 0 24px,#FFF6EE 24px 42px);}
.appbar .inner{max-width:560px;margin:0 auto;padding:12px 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.wordmark{display:flex;align-items:center;}
.wm{font-family:'Anton',sans-serif;font-size:20px;line-height:.95;color:#8E1F2C;letter-spacing:.015em;}
.wmtag{font-family:'Oswald',sans-serif;font-weight:600;font-size:7.5px;letter-spacing:.13em;color:#8E1F2C;opacity:.8;margin-top:3px;}
.wordmark .mk{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#8E1F2C,#6E1620);display:flex;align-items:center;justify-content:center;}
.wordmark .mk svg{width:15px;height:15px;stroke:#fff;}
.wordmark em{font-style:normal;color:var(--brand);}
.seg{display:flex;background:#F1EADC;border-radius:8px;padding:2px;border:1px solid var(--line2);}
.seg button{border:none;background:transparent;color:#F6C6C9;font-family:'Inter',sans-serif;font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:6px;cursor:pointer;}
.seg button.on{background:var(--brand);color:#fff;box-shadow:0 1px 6px rgba(196,40,50,.35);}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#8E1F2C,#6E1620);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;cursor:pointer;}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,253,248,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:60;padding-bottom:env(safe-area-inset-bottom);}
.tabbar .inner{max-width:560px;margin:0 auto;display:flex;}
.tabbar button{flex:1;border:none;background:none;padding:8px 2px;cursor:pointer;font-size:10px;font-weight:600;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'Inter',sans-serif;}
.tabbar button svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.tabbar button.on{color:var(--brand);}
main{padding-top:14px;}
h2{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:2px 0 10px;}
.sub{color:var(--ink3);font-size:12px;font-weight:500;margin-top:-8px;margin-bottom:12px;}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin:12px 0 5px;display:block;}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 8px;}
.sechead h4{font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);}
.sechead span{font-size:11px;color:var(--ink3);font-weight:600;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:10px;}
.card.pad0{padding:0;overflow:hidden;}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);}
.rowline:last-child{border-bottom:none;}
.mono{font-family:'JetBrains Mono',monospace;}
.muted{color:var(--ink3);font-size:12px;}
.kv{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--ink2);font-size:13px;}
.kv .v{font-weight:600;font-size:13px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}
.dot.ok{background:var(--ok);}.dot.warn{background:var(--warn);}.dot.err{background:var(--err);}.dot.idle{background:var(--line2);}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.04em;border-radius:5px;padding:3px 7px;text-transform:uppercase;}
.chip.ok{background:var(--ok-bg);color:var(--ok);}
.chip.warn{background:var(--warn-bg);color:var(--warn);}
.chip.err{background:var(--err-bg);color:var(--err);}
.chip.brand{background:rgba(31,169,190,.12);color:#137A8A;}
button.pri{width:100%;border:none;background:linear-gradient(135deg,#8E1F2C,#6E1620);color:#fff;font-weight:700;font-size:14px;padding:13px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;}
button.pri:disabled{background:var(--line2);cursor:not-allowed;}
button.pri:not(:disabled):active{filter:brightness(.85);}
button.sec{width:100%;border:1.5px solid var(--line2);background:var(--elev);color:var(--ink);font-weight:700;font-size:13px;padding:11px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;}
button.tiny{border:1px solid rgba(196,40,50,.35);background:rgba(196,40,50,.06);color:var(--brand);font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:7px;cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif;}
input,select,textarea{width:100%;border:1.5px solid var(--line2);border-radius:9px;padding:10px 11px;font-family:'Inter',sans-serif;font-size:15px;background:var(--elev);color:var(--ink);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,169,190,.15);}
input.num{font-family:'JetBrains Mono',monospace;font-weight:600;text-align:center;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:11px 12px;}
.stat b{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;display:block;}
.stat i{font-style:normal;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);}
.stat.dark{background:linear-gradient(150deg,#8E1F2C,#6E1620);border-color:#6E1620;color:#fff;}
.stat.dark i{color:#F6C6C9;}
.stop{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:12px 13px;margin-bottom:8px;cursor:pointer;}
.stop .ord{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;color:var(--ink3);min-width:20px;}
.stop .nm{font-weight:700;font-size:14px;}
.stop .meta{color:var(--ink3);font-size:11.5px;margin-top:1px;}
.stop.done{opacity:.5;}
.ring{position:relative;width:52px;height:52px;flex-shrink:0;}
.ring svg{transform:rotate(-90deg);}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#fff;}
.alertstrip{display:flex;align-items:center;gap:10px;background:var(--err-bg);border:1px solid #F2C6C9;border-radius:10px;padding:10px 12px;margin-bottom:10px;cursor:pointer;}
.alertstrip svg{width:17px;height:17px;stroke:var(--err);flex-shrink:0;}
.alertstrip b{font-size:12.5px;color:#8E1B24;}
.steps{display:flex;gap:5px;margin:12px 0 14px;}
.steps .s{flex:1;height:4px;border-radius:2px;background:var(--line);}
.steps .s.on{background:var(--brand);}
.dosepanel{background:linear-gradient(150deg,#8E1F2C,#6E1620);border:none;color:#FDEDEE;border-radius:var(--r);padding:14px;margin-top:10px;}
.dosepanel .dr{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.28);}
.dosepanel .dr:last-child{border:none;}
.dosepanel .dv{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;color:var(--gold);}
.dosepanel .dk{font-size:12.5px;color:#F6C6C9;}
.tasklist label{display:flex;align-items:center;gap:11px;background:var(--elev);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;margin:6px 0;font-size:13.5px;font-weight:600;cursor:pointer;}
.tasklist label .flags{margin-left:auto;display:flex;gap:5px;align-items:center;}
.tasklist label .flags .f{font-size:8.5px;font-weight:700;letter-spacing:.05em;color:var(--ink3);border:1px solid var(--line2);border-radius:4px;padding:2px 5px;}
.tasklist label .flags .f.cam{color:var(--brand-d);border-color:#BFDDE3;}
.tasklist input{width:19px;height:19px;accent-color:var(--teal);flex-shrink:0;}
.tasklist label:has(input:checked){border-color:var(--teal);background:rgba(31,169,190,.08);}
.modal{position:fixed;inset:0;background:rgba(11,31,38,.6);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--surface);border-top:6px solid var(--brand);width:100%;max-width:560px;max-height:93vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:14px 14px 30px;}
.grab{width:38px;height:4px;background:#D9CDB8;border-radius:2px;margin:0 auto 12px;}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.sheethead h3{font-size:17px;font-weight:800;}
.x{border:none;background:var(--elev);width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;color:var(--ink2);}
.toast{position:fixed;bottom:calc(74px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1C2A33;border:1px solid rgba(245,184,46,.5);color:#fff;font-size:12.5px;font-weight:600;padding:10px 16px;border-radius:9px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px;white-space:nowrap;}
.toast svg{width:15px;height:15px;stroke:var(--gold);}
.fb{display:flex;gap:8px;margin-top:10px;}
.fb button{flex:1;border:1.5px solid var(--line2);background:var(--elev);border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink2);font-family:'Inter',sans-serif;}
.fb button.sel{border-color:var(--teal);background:rgba(31,169,190,.08);color:var(--teal);}
.search{position:relative;margin-bottom:10px;}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;stroke:var(--ink3);}
.search input{padding-left:34px;font-size:14px;}
.empty{text-align:center;padding:28px 14px;color:var(--ink3);font-size:13px;}
.empty svg{width:34px;height:34px;stroke:var(--line2);margin-bottom:8px;}
hr.d{border:none;border-top:1px dashed var(--line);margin:10px 0;}
.pipewrap{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;}
.pipecol{min-width:225px;flex:0 0 225px;background:var(--elev);border:1px solid var(--line);border-radius:12px;padding:8px;}
.pipehead{display:flex;justify-content:space-between;align-items:center;padding:5px 7px 8px;}
.pipehead b{font-family:'Oswald',sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.09em;}
.pipecard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px;box-shadow:var(--sh);}
.pipecard .mv{display:flex;justify-content:space-between;margin-top:7px;gap:6px;}
.pipecard .mv button{flex:1;border:1px solid var(--line2);background:var(--elev);border-radius:7px;padding:6px;font-size:11px;font-weight:700;cursor:pointer;color:var(--ink2);font-family:'Inter',sans-serif;}
/* tech privacy */
body.techlock{-webkit-user-select:none;user-select:none;}
body.techlock img{pointer-events:none;}
#wmark{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden;display:none;}
body.techlock #wmark{display:none;}
#wmark span{position:absolute;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:rgba(142,31,44,.07);white-space:nowrap;transform:rotate(-28deg);}
body.techblur main,body.techblur .tabbar{filter:blur(16px);transition:filter .15s;}
.donewrap{opacity:.75;}
/* desktop / web layout */
@media(min-width:900px){
  .wrap{max-width:920px;}
  body{padding-bottom:24px;padding-left:216px;}
  .appbar .inner{max-width:none;padding:12px 26px 10px;}
  .tabbar{top:66px;bottom:0;left:0;right:auto;width:216px;border-top:none;border-right:1px solid var(--line);padding-bottom:0;}
  .tabbar .inner{flex-direction:column;max-width:none;padding:14px 10px;gap:2px;}
  .tabbar button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:11px;padding:11px 13px;font-size:12.5px;border-radius:9px;width:100%;}
  .tabbar button.on{background:rgba(142,31,44,.07);}
  .chartgrid{grid-template-columns:repeat(3,1fr);}
  .eqgrid{grid-template-columns:repeat(6,1fr);}
  .modal{align-items:center;padding:20px;}
  .sheet{border-radius:16px;max-height:88vh;}
}
/* insights */
.rangeseg{display:flex;background:#F1EADC;border:1.5px solid var(--line2);border-radius:9px;padding:2px;}
.rangeseg button{flex:1;border:none;background:none;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;padding:7px 0;border-radius:7px;cursor:pointer;color:var(--ink3);}
.rangeseg button.on{background:var(--brand);color:#fff;}
.chartgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.chart{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:10px 10px 8px;}
.chart .ct{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.chart .lg{display:flex;gap:6px;}
.chart .lg i{font-style:normal;font-size:9px;font-weight:600;color:var(--ink3);display:flex;align-items:center;gap:3px;}
.chart .lg i::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--cc,var(--brand));display:inline-block;}
.chart canvas{width:100%;height:74px;display:block;}
/* equipment chips */
.eqgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.eq{border:1.5px solid var(--line);border-radius:10px;background:var(--elev);padding:9px 4px 7px;text-align:center;cursor:pointer;}
.eq svg{width:26px;height:26px;stroke:var(--ink3);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;margin-bottom:3px;}
.eq b{display:block;font-size:9.5px;font-weight:700;color:var(--ink2);line-height:1.2;}
.eq.sel{border-color:var(--teal);background:rgba(31,169,190,.08);}
.eq.sel svg{stroke:var(--teal);}
.eq.sel b{color:var(--teal);}
/* workflow editor */
.wfrow{display:flex;align-items:center;gap:9px;background:var(--elev);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;margin:6px 0;}
.wfrow .h{color:var(--line2);font-size:14px;letter-spacing:-2px;cursor:default;}
.wfrow .n{flex:1;font-size:13px;font-weight:600;}
.wfrow .tg{font-size:8.5px;font-weight:700;letter-spacing:.05em;border:1px solid var(--line2);border-radius:4px;padding:3px 6px;cursor:pointer;color:var(--ink3);}
.wfrow .tg.on{border-color:var(--teal);color:var(--teal);background:rgba(31,169,190,.08);}
.wfrow .rm{border:none;background:none;color:var(--err);font-size:15px;cursor:pointer;padding:0 2px;}
.radio{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13.5px;font-weight:600;cursor:pointer;}
.radio input{width:18px;height:18px;accent-color:var(--brand);}
.switch{position:relative;width:40px;height:23px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch span{position:absolute;inset:0;background:var(--line2);border-radius:12px;transition:.15s;cursor:pointer;}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch input:checked+span{background:var(--brand);}
.switch input:checked+span::after{left:20px;}
.menu{position:fixed;inset:0;background:rgba(11,31,38,.6);z-index:110;display:flex;justify-content:flex-end;}
.menupanel{background:#1C2A33;border-left:6px solid var(--brand);width:250px;height:100%;padding:18px 0;overflow-y:auto;}
.menupanel .mi{display:flex;align-items:center;justify-content:space-between;color:#C8DDE1;font-size:12px;font-weight:700;letter-spacing:.08em;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;}
.menupanel .mi:active{background:var(--chrome2);}
.menupanel .mi span{font-size:9px;color:#5E7E85;letter-spacing:.04em;}
</style>
</head>
<body>

<div class="appbar"><div class="inner">
  <div class="wordmark"><div><div class="wm">SAVVY SWIM</div><div class="wmtag">ON DUTY, SO YOU DON'T HAVE TO BE.</div></div></div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="seg"><button id="tgCo" class="on" onclick="setMode('co')">Admin</button><button id="tgTech" onclick="setMode('tech')">Tech</button><button id="tgCu" onclick="setMode('cu')">Customer</button></div>
    <div class="avatar" onclick="openMenu()">MS</div>
  </div>
</div></div>

<main class="wrap" id="main"></main>
<div class="tabbar"><div class="inner" id="nav"></div></div>
<div id="wmark"></div><div id="modalRoot"></div><div id="toastRoot"></div><div id="menuRoot"></div>

<script>
/* localStorage-backed storage shim for the embedded console */
window.storage = window.storage || {
  async get(k){ const v = localStorage.getItem(k); if(v===null) throw new Error('not found'); return { value: v }; },
  async set(k,v){ localStorage.setItem(k, v); return true; },
  async delete(k){ localStorage.removeItem(k); return true; }
};
</script>
<script>

const IC={

drop:'<svg viewBox="0 0 24 24"><path d="M12 2.7c3.2 4 6 7.2 6 10.8a6 6 0 1 1-12 0c0-3.6 2.8-6.8 6-10.8z"/></svg>',

function esc(s){return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}

function todayDay(){return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()];}
function daysSince(iso){return Math.round((Date.now()-new Date(iso))/864e5);}
function lsi(ph,ta,ch,temp){const tf=temp>=94?0.8:temp>=84?0.7:temp>=76?0.6:temp>=66?0.5:0.4;
  return +(ph+tf+(Math.log10(Math.max(ch,25))-0.4)+Math.log10(Math.max(ta,25))-12.1).toFixed(2);}
function clOz(gal,cur,tgt){return Math.round(Math.max(0,tgt-cur)*gal/10000*10.7);}
function acOz(gal,ph){return ph<=7.6?0:Math.round((ph-7.5)/0.1*5*gal/10000);}
function statusOf(c){if(c.flag)return['Flagged','err'];if(c.lastFC==null)return['No data','idle'];
  if(c.lastFC>=2&&c.lastFC<=4&&c.lastPH>=7.2&&c.lastPH<=7.8)return['Balanced','ok'];
  if(c.lastFC<1)return['Low FC','err'];return['Adjust','warn'];}
function wfOf(c){return c.workflow||DEFAULT_WF;}
function alertPriority(flag){
  const f=(flag||'').toLowerCase();
  if(/leak|no flow|breaker|burn|smoke|spark/.test(f))return['HIGH','err'];
  if(/chemistry|out of range|low fc|algae/.test(f))return['MED','warn'];
  return['LOW','brand'];
}
function hav(a,b){const R=3959,dLa=(b[0]-a[0])*Math.PI/180,dLo=(b[1]-a[1])*Math.PI/180;
  const x=Math.sin(dLa/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLo/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function routeMetrics(stops){
  let mi=0;for(let i=1;i<stops.length;i++){const a=CITY_GEO[stops[i-1].city],b=CITY_GEO[stops[i].city];if(a&&b)mi+=hav(a,b);}
  mi=Math.round(mi*1.3);const drive=Math.round(mi/28*60);
  return {mi,drive,service:stops.length*25};
}

/* ---- FINANCE (P&L, invoices, expenses) ---- */
const EXP_CATS=['Chemicals','Fuel','Insurance','Equipment','Subcontractor','Software','Marketing','Other'];
const EXP_COLORS={Chemicals:'#1FA9BE',Fuel:'#E8823C',Insurance:'#8B7BE0',Equipment:'#8E1F2C',Subcontractor:'#2E7FC2',Software:'#A9B33C',Marketing:'#E060A8',Other:'#8C9AA1'};
function monthISO(){return dISO().slice(0,7);}
let finRange=1;
function finStart(){const d=new Date();d.setMonth(d.getMonth()-(finRange-1));d.setDate(1);return d.toISOString().slice(0,10);}
function donutSVG(data,size){
  const tot=data.reduce((a,x)=>a+x.val,0)||1;const r=size/2-8,cx=size/2,cy=size/2;let a0=-Math.PI/2,out='';
  data.forEach(x=>{const a1=a0+x.val/tot*Math.PI*2;
    const large=(a1-a0)>Math.PI?1:0;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    out+=`<path d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="${x.color}"/>`;
    a0=a1;});
  out+=`<circle cx="${cx}" cy="${cy}" r="${r*0.55}" fill="var(--card)"/>`;
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex-shrink:0;">${out}</svg>`;
}
function chemBreakdown(){
  const st=finStart();
  const vs=S.visits.filter(v=>v.date>=st);
  let liq=0,acid=0;vs.forEach(v=>{if(v.dose){liq+=(v.dose.clOz||0)*CL_COST;acid+=(v.dose.acidOz||0)*AC_COST;}});
  const kw=[['Chlorine tabs',/tab/i,'#8E1F2C'],['Cal-hypo shock',/shock|hypo/i,'#1FA9BE'],['DE',/de|diatom/i,'#E060A8'],['Salt',/salt/i,'#F5B82E'],['Soda ash / bicarb',/soda|bicarb/i,'#8B7BE0']];
  const rows=[{label:'Liquid chlorine',val:liq,color:'#2E7FC2'},{label:'Muriatic acid',val:acid,color:'#C89A6B'}];
  S.expenses.filter(e=>e.cat==='Chemicals'&&e.date>=st).forEach(e=>{
    const hit=kw.find(k=>k[1].test(e.note||''));
    const label=hit?hit[0]:'Other chemicals',color=hit?hit[2]:'#8C9AA1';
    const ex=rows.find(r=>r.label===label);
    if(ex)ex.val+=e.amount;else rows.push({label,val:e.amount,color});});
  return rows.filter(r=>r.val>0.005).sort((a,b)=>b.val-a.val);
}

/* ============ COMPANY · ROUTE ============ */
const CITY_GEO={"Dallas":[32.78,-96.80],"Highland Park":[32.833,-96.792],"University Park":[32.850,-96.800],"Plano":[33.02,-96.70],"Frisco":[33.15,-96.82],"Prosper":[33.24,-96.80],"Celina":[33.32,-96.78],"McKinney":[33.20,-96.64],"Allen":[33.10,-96.67],"Rockwall":[32.93,-96.46],"Rowlett":[32.90,-96.56],"Sachse":[32.98,-96.60],"Garland":[32.91,-96.64],"Forney":[32.75,-96.47],"Mesquite":[32.77,-96.60]};
function projectStops(stops){
  const pts=stops.map((c,i)=>{const g=CITY_GEO[c.city]||CITY_GEO["Dallas"];
    // deterministic jitter per id so same-city stops don't overlap
    const h=[...c.id].reduce((a,ch)=>a+ch.charCodeAt(0),0);
    return {c,lat:g[0]+((h%7)-3)*0.008,lng:g[1]+((h%5)-2)*0.010,i};});
  const lats=pts.map(p=>p.lat),lngs=pts.map(p=>p.lng);
  let minLa=Math.min(...lats,32.72),maxLa=Math.max(...lats,33.34),minLo=Math.min(...lngs,-96.88),maxLo=Math.max(...lngs,-96.40);
  const W=340,H=300,P=30;
  pts.forEach(p=>{p.x=P+(p.lng-minLo)/(maxLo-minLo)*(W-2*P);p.y=P+(maxLa-p.lat)/(maxLa-minLa)*(H-2*P);});
  const bg=Object.entries(CITY_GEO).map(([n,g])=>({n,x:P+(g[1]-minLo)/(maxLo-minLo)*(W-2*P),y:P+(maxLa-g[0])/(maxLa-minLa)*(H-2*P)}));
  const lake={x:P+(-96.52-minLo)/(maxLo-minLo)*(W-2*P),y:P+(maxLa-32.87)/(maxLa-minLa)*(H-2*P)};
  return {pts,bg,lake,W,H};
}
function stopGeo(c){const g=CITY_GEO[c.city]||CITY_GEO["Dallas"];
  const h=[...c.id].reduce((a,ch)=>a+ch.charCodeAt(0),0);
  return [g[0]+((h%7)-3)*0.008,g[1]+((h%5)-2)*0.010];}
let geo={watchId:null,dwellStop:null,dwellStart:null,arrivedFor:{}};
function startGeo(){
  if(geo.watchId!==null||!navigator.geolocation)return;
  try{geo.watchId=navigator.geolocation.watchPosition(p=>checkGeo(p.coords.latitude,p.coords.longitude),()=>{},{enableHighAccuracy:true,maximumAge:15000});}catch(e){}
}
function stopGeoWatch(){if(geo.watchId!==null&&navigator.geolocation){navigator.geolocation.clearWatch(geo.watchId);geo.watchId=null;}geo.dwellStop=null;geo.dwellStart=null;}
function techPending(){
  if(!curTech)return[];
  const t=S.techs.find(x=>x.id===curTech)||S.techs[0];const day=todayDay();
  const doneIds=S.visits.filter(v=>v.date===dISO()).map(v=>v.custId);
  let st=S.customers.filter(c=>c.status!=='inactive'&&c.sched.tech===t.init&&c.day===day);
  if(!st.length)st=S.customers.filter(c=>c.status!=='inactive'&&c.sched.tech===t.init&&c.day);

}
function checkGeo(lat,lng){
  if(mode!=='tech'||$('modalRoot').innerHTML)return;
  const pend=techPending(); if(!pend.length)return;
  let near=null,nd=1e9;
  pend.forEach(c=>{const d=hav([lat,lng],stopGeo(c));if(d<nd){nd=d;near=c;}});
  if(near&&nd<=0.12){
    if(!geo.arrivedFor[near.id]){geo.arrivedFor[near.id]=1;
      pushUpdate(near.id,'sms','Your Savvy Swim technician has arrived 🛠️');save();
      toast('Arrived at '+near.name+' — auto-start in '+S.autoStartMin+' min');}
    if(geo.dwellStop!==near.id){geo.dwellStop=near.id;geo.dwellStart=Date.now();}
    else if(Date.now()-geo.dwellStart>=S.autoStartMin*60000){
      geo.dwellStop=null;geo.dwellStart=null;
      toast('Auto-starting visit — on site '+S.autoStartMin+' min');
      openVisit(near.id);
    }
  } else {geo.dwellStop=null;geo.dwellStart=null;}
}

function liveDose(){
  const c=S.customers.find(x=>x.id===vr.custId);
  const fc=parseFloat($('rFC').value),ph=parseFloat($('rPH').value),ta=parseFloat($('rTA').value)||90,ch=parseFloat($('rCH').value)||300,t=parseFloat($('rT').value)||84,psi=parseFloat($('rPSI')?.value)||null;
  if(isNaN(fc)||isNaN(ph)){$('doseLive').innerHTML='<div class="muted" style="margin-top:10px;">Enter FC and pH — dosing calculates automatically.</div>';vr.dose=null;return;}
  const cl=clOz(c.gallons,fc,3),ac=acOz(c.gallons,ph),L=lsi(ph,ta,ch,t),cost=cl*CL_COST+ac*AC_COST;
  vr.readings={fc,ph,ta,ch,cya:parseFloat($('rCYA').value)||null,temp:t,psi,salt:parseFloat($('rSalt')?.value)||null};
  vr.dose={cl,ac,lsi:L,cost};
  const li=L<-0.3?'Corrosive — raise TA/pH':L>0.3?'Scale risk — lower pH':'Balanced';
  $('doseLive').innerHTML=`<div class="dosepanel">
    <div class="dr"><span class="dk">Liquid chlorine 12.5% → FC 3.0</span><span class="dv">${cl} oz</span></div>
    <div class="dr"><span class="dk">Muriatic acid 31.45% → pH 7.5</span><span class="dv">${ac?ac+' oz':'—'}</span></div>
    <div class="dr"><span class="dk">LSI ${L>=0?'+':''}${L} · ${li}</span><span class="dv" style="font-size:13px;">$${cost.toFixed(2)}</span></div>
  </div>`;
}

const STAGES=[['new','NEW LEAD','#1FA9BE'],['contacted','CONTACTED','#2E7FC2'],['quoted','QUOTE SENT','#8B7BE0'],['follow','FOLLOW-UP','#B8930B'],['won','WON','#188A54'],['lost','LOST','#C0303B']];
async function moveStage(id,dir){
  const q=S.quotes.find(x=>x.id===id); if(!q)return;
  const order=STAGES.map(x=>x[0]);
  let i=order.indexOf(q.stage)+dir;
  i=Math.max(0,Math.min(order.length-1,i));
  const next=order[i];
  if(next===q.stage)return;
  if(next==='won'){q.stage='won';q.stageDate=dISO();await convertQuote(id);toast('Deal won — customer created 🎉');return;}
  if(next==='lost'){q.denied=true;}else{q.denied=false;q.converted=false;}
  q.stage=next;q.stageDate=dISO();
  await save();render();
}
function vPipeline(){
  const open=S.quotes.filter(q=>!['won','lost'].includes(q.stage));

        return `<div class="pipecard">

          <b style="font-size:12.5px;color:var(--brand);">${esc(q.name||'Unnamed lead')}</b>

        </div>
        <div class="muted" style="font-size:10.5px;margin-top:2px;">${esc(q.city)}${q.spa&&q.spa!=='none'?' · '+q.spa+' spa':''}${q.cond==='green'?' · green':''}</div>

        ${key!=='won'&&key!=='lost'?`<div class="mv">
          <button onclick="moveStage('${q.id}',-1)" ${key==='new'?'disabled style="opacity:.35;"':''}>◀</button>

async function importCSV(inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  const txt=await f.text();
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length)return toast('Empty file');
  let start=0;const h=lines[0].toLowerCase();

  let added=0;
  for(let i=start;i<lines.length;i++){
    const p=lines[i].split(',').map(x=>x.trim().replace(/^"|"$/g,''));
    if(!p[0])continue;
    S.customers.push({id:uid(),name:p[0],address:p[1]||'',city:CITY_PRICES[p[2]]?p[2]:'Dallas',phone:p[3]||'',email:p[4]||'',

      sched:{freq:"Once a week",tech:"MS",chargeChems:false,payType:"Monthly flat rate",billMethod:"Paid in advance",invoiceDay:8}});

  }
  inp.value='';
  await save();render();toast(added+' customers imported — assign route days');
}

function pickEq(gid,el,toggle){
  const g=$(gid);
  if(toggle&&el.classList.contains('sel')){el.classList.remove('sel');return;}
  [...g.children].forEach(x=>x.classList.remove('sel'));el.classList.add('sel');
}

    <span class="h">⋮⋮</span><span class="n">${esc(t)}</span>
    <span class="tg ${cam?'on':''}" onclick="wfDraft[${i}][2]=wfDraft[${i}][2]?0:1;drawWf()">PHOTO</span>
    <span class="tg ${req?'on':''}" onclick="wfDraft[${i}][1]=wfDraft[${i}][1]?0:1;drawWf()">REQ</span>

async function savePoolConfig(id){
  const c=S.customers.find(x=>x.id===id);
  c.serviceLevel=$('pcLevel').value;c.poolType=$('pcType').value;c.gallons=+$('pcGal').value||c.gallons;

function compressPick(inp,cb){
  const f=inp.files&&inp.files[0]; if(!f)return;
  const img=new Image(), rd=new FileReader();
  rd.onload=e=>{img.onload=()=>{
    const cv=document.createElement('canvas');const sc=Math.min(1,900/img.width);
    cv.width=img.width*sc;cv.height=img.height*sc;
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    cb(cv.toDataURL('image/jpeg',0.55));};img.src=e.target.result;};
  rd.readAsDataURL(f);inp.value='';
}

function area(id,series){
  const cv=$(id);if(!cv)return;const x=cv.getContext('2d');
  const W=cv.width=cv.offsetWidth*2,H=cv.height=148;
  x.fillStyle='#FFFFFF';x.fillRect(0,0,W,H);
  x.strokeStyle='#EFE8DA';x.lineWidth=1;
  for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,H/4*i);x.lineTo(W,H/4*i);x.stroke();}
  let any=false;
  series.forEach(s=>{
    const data=s.d.filter(v=>v!=null);if(!data.length)return;any=true;
    const y=v=>H-8-((v-s.lo)/(s.hi-s.lo))*(H-16);
    const px=i=>data.length===1?W/2:i/(data.length-1)*(W-24)+12;
    x.beginPath();x.moveTo(px(0),H);
    data.forEach((v,i)=>x.lineTo(px(i),y(v)));
    x.lineTo(px(data.length-1),H);x.closePath();
    x.fillStyle=s.col+'2A';x.fill();
    x.strokeStyle=s.col;x.lineWidth=3.5;x.lineJoin='round';x.beginPath();
    data.forEach((v,i)=>i?x.lineTo(px(i),y(v)):x.moveTo(px(i),y(v)));
    x.stroke();
    x.fillStyle=s.col;
    data.forEach((v,i)=>{x.beginPath();x.arc(px(i),y(v),4,0,7);x.fill();});
  });
  if(!any){x.fillStyle='#B9AE99';x.font='600 20px Inter';x.fillText('No data in range',W/2-84,H/2+6);}
}

    <b style="display:block;font-size:14.5px;margin-top:4px;">Love your Savvy Swim service?</b>
    <div style="font-size:11.5px;color:#F6C6C9;margin-top:3px;">A 30-second Google review is the biggest thank-you there is — and your before/after photos above are saved and ready to attach.</div>
    <button class="pri" style="margin-top:11px;background:#fff;color:#8E1F2C;" onclick="window.open(REVIEW_URL,'_blank')">Leave a Google review ★</button>
  </div>`:''}`:'<div class="empty">'+IC.drop+'<div>Your first service report will appear here</div></div>'}
  <button class="pri" onclick="toast('Request sent — we’ll text you today')">Request extra service</button>`;
}
async function feedback(v){const c=pc();c.feedback=v;await save();render();toast(v==='up'?'Thanks for the feedback':'We’ll make it right — expect a text');}
function vHistory(){
  const c=pc();
  const items=[
    ...S.visits.filter(v=>v.custId===c.id).map(v=>({d:v.date,kind:'visit',v})),
    ...S.jobs.filter(j=>j.custId===c.id&&j.status==='done').map(j=>({d:j.date,kind:'job',j}))
  ].sort((a,b)=>b.d.localeCompare(a.d));
  const WF=wfOf(c);
  const list=items.map(it=>{
    if(it.kind==='job')return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
      <b style="font-size:13px;">🔧 ${esc(it.j.type)}</b><span class="chip brand">${fmt$(it.j.price)}</span></div>
      <div class="muted mono" style="margin-top:2px;">${it.d}</div></div>`;
    const v=it.v;
    return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;">
      <b style="font-size:13px;">Weekly service</b><b class="mono" style="font-size:11.5px;color:var(--ink3);">${v.date}</b></div>
      <div class="muted" style="margin-top:4px;">FC ${v.readings.fc} · pH ${v.readings.ph}${v.readings.psi?' · '+v.readings.psi+' psi':''} · ${v.tasks.length} tasks done</div>
      ${v.notes?`<div class="muted" style="margin-top:3px;">"${esc(v.notes)}"</div>`:''}
      ${photoPair(v,true)}</div>`;
  }).join('');
  return `${picker()}<h2>Service record</h2><div class="sub">Every visit, every reading, every job — your pool's full history.</div>
  ${list||'<div class="empty">No services yet</div>'}
  <div class="sechead"><h4>Water trends</h4></div>
  <div class="chartgrid">
    <div class="chart" style="grid-column:span 2;"><div class="ct">Chlorine / pH<div class="lg"><i style="--cc:#1FA9BE;">Chlorine</i><i style="--cc:#8E1F2C;">pH</i></div></div><canvas id="cc1"></canvas></div>
    <div class="chart"><div class="ct">Filter PSI</div><canvas id="cc2"></canvas></div>
    <div class="chart"><div class="ct">Water temp</div><canvas id="cc3"></canvas></div>
  </div>`;
}
function drawCustCharts(){
  const c=pc();if(!c)return;
  const vs=S.visits.filter(v=>v.custId===c.id).slice(-12);
  const g=k=>vs.map(v=>v.readings[k]);
  area('cc1',[{d:g('fc'),col:'#1FA9BE',lo:0,hi:6},{d:g('ph'),col:'#8E1F2C',lo:6.8,hi:8.2}]);
  area('cc2',[{d:g('psi'),col:'#2E7FC2',lo:0,hi:22}]);
  area('cc3',[{d:g('temp'),col:'#F5B82E',lo:50,hi:100}]);
}
function vCBilling(){
  const c=pc();if(!c)return '<div class="empty">No account</div>';
  const paid=(S.invoices||[]).includes(c.id);
  return `${picker()}<h2>Billing</h2>
  <div class="card">
    <div class="kv"><span class="k">Plan</span><span class="v">${esc(c.serviceLevel)}</span></div>
    <div class="kv"><span class="k">Monthly rate</span><span class="v mono">${fmt$(c.rate)}</span></div>
    <div class="kv"><span class="k">Billed</span><span class="v">${esc(c.sched.billMethod)} · day ${c.sched.invoiceDay}</span></div>
    <div class="kv"><span class="k">${new Date().toLocaleString('en-US',{month:'long'})}</span><span class="chip ${paid?'ok':'warn'}">${paid?'Paid':'Due'}</span></div>
  </div>
  <button class="pri" onclick="toast('Autopay enabled — Stripe live in v2')">Enable autopay</button>`;
}
function vRefer(){
  const c=pc();
  return `${picker()}<h2>Refer a neighbor</h2>
  <div class="card" style="background:linear-gradient(150deg,#8E1F2C,#6E1620);border-color:#6E1620;color:#fff;">
    <div style="font-size:20px;font-weight:800;">Get a free month</div>
    <div style="color:#F6C6C9;font-size:13px;margin-top:4px;">For every neighbor who signs up with your code. They get 20% off their first month.</div>
    <div style="margin-top:12px;display:inline-block;background:rgba(255,255,255,.14);border:1px dashed rgba(255,255,255,.45);border-radius:8px;padding:8px 14px;" class="mono">SWIM-${c?c.id.slice(0,4).toUpperCase():'0000'}</div>
  </div>
  <button class="pri" onclick="toast('Share link copied')">Share my link</button>`;
}

document.addEventListener('contextmenu',e=>{if(mode==='tech')e.preventDefault();});
document.addEventListener('keydown',e=>{if(mode==='tech'&&(e.key==='PrintScreen'||((e.metaKey||e.ctrlKey)&&e.shiftKey&&['s','S','3','4','5'].includes(e.key)))){e.preventDefault();toast('Screen capture is disabled in tech mode');}});
window.addEventListener('blur',()=>{if(mode==='tech')document.body.classList.add('techblur');});
window.addEventListener('focus',()=>document.body.classList.remove('techblur'));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='tech')document.body.classList.add('techblur');else document.body.classList.remove('techblur');});
setInterval(()=>{if(mode==='tech')drawWatermark();},60000);
load();
</script>
