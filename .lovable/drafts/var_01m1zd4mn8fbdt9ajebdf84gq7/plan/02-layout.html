<!doctype html>
<html><head><meta charset="utf-8"><style>
svg{font-family:var(--font-sans)}
.hd{font-size:14px;font-weight:480;fill:hsl(var(--foreground))}
.sm{font-size:12px;fill:hsl(var(--muted-foreground))}
.it{font-size:12px;font-style:italic;fill:hsl(var(--muted-foreground))}
.tag{font-size:11px;fill:hsl(var(--muted-foreground))}
</style></head><body>
<svg viewBox="0 0 640 400" width="640" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect x="16" y="16" width="290" height="368" rx="8" fill="none" stroke="hsl(var(--border))" stroke-dasharray="4 3"/>
  <text x="28" y="36" class="tag">before</text>
  <g>
    <rect x="32" y="48" width="122" height="96" rx="8" fill="hsl(var(--muted))" stroke="hsl(var(--muted-foreground))"/>
    <rect x="168" y="48" width="122" height="96" rx="8" fill="hsl(var(--muted))" stroke="hsl(var(--muted-foreground))"/>
    <rect x="32" y="156" width="122" height="96" rx="8" fill="hsl(var(--muted))" stroke="hsl(var(--muted-foreground))"/>
    <rect x="168" y="156" width="122" height="96" rx="8" fill="hsl(var(--muted))" stroke="hsl(var(--muted-foreground))"/>
    <rect x="32" y="264" width="122" height="96" rx="8" fill="hsl(var(--muted))" stroke="hsl(var(--muted-foreground))"/>
    <rect x="168" y="264" width="122" height="96" rx="8" fill="hsl(var(--muted))" stroke="hsl(var(--muted-foreground))"/>
    <text x="44" y="104" class="sm">photo card</text>
    <text x="180" y="104" class="sm">photo card</text>
    <text x="44" y="212" class="sm">photo card</text>
    <text x="180" y="212" class="sm">photo card</text>
    <text x="44" y="320" class="sm">photo card</text>
    <text x="180" y="320" class="sm">photo card</text>
  </g>

  <line x1="316" y1="200" x2="344" y2="200" stroke="hsl(var(--muted-foreground))" marker-end="url(#c)"/>
  <defs><marker id="c" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 z" fill="hsl(var(--muted-foreground))"/></marker></defs>

  <rect x="352" y="16" width="272" height="368" rx="8" fill="none" stroke="hsl(var(--accent))"/>
  <text x="364" y="36" class="tag">after</text>
  <text x="368" y="62" class="hd">WHAT DO WE OFFER?</text>
  <text x="368" y="80" class="it">I thought you'd never ask!</text>
  <line x1="368" y1="92" x2="608" y2="92" stroke="hsl(var(--border))"/>
  <text x="368" y="110" class="tag">POOL CARE</text>

  <g>
    <text x="368" y="136" class="sm">01</text><text x="398" y="136" class="hd">WEEKLY MAINTENANCE PLANS</text>
    <line x1="368" y1="146" x2="608" y2="146" stroke="hsl(var(--border))"/>
    <text x="368" y="168" class="sm">02</text><text x="398" y="168" class="hd">FILTER CLEAN</text>
    <line x1="368" y1="178" x2="608" y2="178" stroke="hsl(var(--border))"/>
    <text x="368" y="200" class="sm">03</text><text x="398" y="200" class="hd">GREEN POOL RECOVERY</text>
    <line x1="368" y1="210" x2="608" y2="210" stroke="hsl(var(--border))"/>
    <text x="368" y="232" class="sm">04</text><text x="398" y="232" class="hd">ALGAE REMOVAL</text>
    <line x1="368" y1="242" x2="608" y2="242" stroke="hsl(var(--border))"/>
    <text x="368" y="264" class="sm">...</text><text x="398" y="264" class="sm">through 13 items</text>
    <line x1="368" y1="274" x2="608" y2="274" stroke="hsl(var(--border))"/>
  </g>

  <circle cx="376" cy="306" r="9" fill="hsl(var(--accent))"/>
  <text x="376" y="310" text-anchor="middle" style="font-size:11px;fill:hsl(var(--accent-foreground))">1</text>
  <text x="394" y="310" class="sm">each line taps through to a quote request,</text>
  <text x="394" y="326" class="sm">with that service pre-filled</text>

  <rect x="368" y="344" width="240" height="28" rx="8" fill="none" stroke="hsl(var(--muted-foreground))" stroke-dasharray="4 3"/>
  <text x="380" y="362" class="sm">Swim Club + map sections unchanged</text>
</svg>
</body></html>
