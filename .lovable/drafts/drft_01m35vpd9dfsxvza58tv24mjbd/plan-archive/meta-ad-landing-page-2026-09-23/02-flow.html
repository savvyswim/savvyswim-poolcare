<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: var(--fg-primary); }
    .lbl { font-size: 14px; font-weight: 480; }
    .nt { font-size: 12px; fill: var(--fg-secondary); }
    .mono { font-family: var(--font-mono); font-size: 12px; fill: var(--fg-secondary); }
    .bx { fill: none; stroke: var(--fg-secondary); stroke-width: 1; rx: 8; }
    .w { stroke: var(--fg-secondary); stroke-width: 1; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--fg-secondary)"/>
    </marker>
  </defs>

  <rect class="bx" x="16" y="60" width="130" height="60"/>
  <text class="lbl" x="81" y="86" text-anchor="middle">Meta ad</text>
  <text class="nt" x="81" y="104" text-anchor="middle">Facebook, Instagram</text>

  <line class="w" x1="146" y1="90" x2="204" y2="90"/>
  <text class="mono" x="175" y="80" text-anchor="middle" style="paint-order:stroke;stroke:var(--bg-primary);stroke-width:4px">/offer</text>

  <rect x="210" y="40" width="180" height="100" rx="8" fill="var(--bg-accent-translucent)" stroke="var(--fg-accent)" stroke-width="1"/>
  <text class="lbl" x="300" y="70" text-anchor="middle" fill="var(--fg-accent)">Ad landing page</text>
  <text class="nt" x="300" y="92" text-anchor="middle">free inspection offer</text>
  <text class="nt" x="300" y="110" text-anchor="middle">one button, no nav</text>

  <line class="w" x1="390" y1="90" x2="448" y2="90"/>
  <text class="mono" x="419" y="80" text-anchor="middle" style="paint-order:stroke;stroke:var(--bg-primary);stroke-width:4px">/survey</text>

  <rect class="bx" x="454" y="60" width="170" height="60"/>
  <text class="lbl" x="539" y="86" text-anchor="middle">Existing survey</text>
  <text class="nt" x="539" y="104" text-anchor="middle">8 questions, then contact</text>

  <line class="w" x1="539" y1="120" x2="539" y2="192"/>
  <rect class="bx" x="454" y="196" width="170" height="60"/>
  <text class="lbl" x="539" y="222" text-anchor="middle">Lead lands</text>
  <text class="nt" x="539" y="240" text-anchor="middle">office email, CRM, follow ups</text>

  <rect x="16" y="196" width="374" height="60" rx="8" fill="none" stroke="var(--border-translucent)" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="nt" x="32" y="222">Campaign tags ride along from the ad link</text>
  <text class="mono" x="32" y="242">?utm_source=facebook&amp;utm_campaign=...</text>
</svg>
