<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>
    .lbl { fill: var(--fg-primary); font-size: 14px; font-weight: 480; }
    .sm  { fill: var(--fg-secondary); font-size: 12px; }
    .bx  { fill: none; stroke: var(--fg-secondary); stroke-width: 1; rx: 8; }
    .gb  { fill: var(--border-translucent); }
    .zn  { fill: none; stroke: var(--border-translucent); stroke-width: 1; stroke-dasharray: 4 3; rx: 8; }
  </style>

  <!-- BEFORE -->
  <text class="sm" x="20" y="18">now: one question per step</text>
  <rect class="bx" x="20" y="30" width="200" height="120"/>
  <rect class="gb" x="36" y="46" width="120" height="8" rx="4"/>
  <rect class="gb" x="36" y="70" width="168" height="16" rx="4"/>
  <rect class="gb" x="36" y="92" width="168" height="16" rx="4"/>
  <rect class="bx" x="36" y="118" width="80" height="20"/>
  <text class="sm" x="52" y="132">Next</text>

  <path d="M228 90 L262 90" stroke="var(--fg-secondary)" fill="none" marker-end="url(#a)"/>
  <rect class="bx" x="268" y="30" width="60" height="120"/>
  <text class="sm" x="280" y="95">Next</text>
  <path d="M336 90 L370 90" stroke="var(--fg-secondary)" fill="none" marker-end="url(#a)"/>
  <rect class="bx" x="376" y="30" width="60" height="120"/>
  <text class="sm" x="388" y="95">Next</text>
  <path d="M444 90 L478 90" stroke="var(--fg-secondary)" fill="none" marker-end="url(#a)"/>
  <rect class="bx" x="484" y="30" width="130" height="120"/>
  <text class="sm" x="498" y="95">contact step</text>

  <!-- AFTER -->
  <text class="sm" x="20" y="196">new: one page, one button</text>
  <rect class="zn" x="20" y="208" width="300" height="172"/>
  <rect class="gb" x="36" y="222" width="268" height="6" rx="3"/>
  <rect class="bx" x="36" y="238" width="268" height="30"/>
  <text class="lbl" x="48" y="257">Q1 ... Q8, all visible</text>
  <rect class="bx" x="36" y="276" width="268" height="30"/>
  <text class="lbl" x="48" y="295">name, phone, email, address</text>
  <rect class="bx" x="36" y="314" width="268" height="24"/>
  <text class="sm" x="48" y="330">required: contact permission</text>
  <rect x="36" y="342" width="268" height="24" rx="8" fill="var(--bg-accent-translucent)"/>
  <text x="48" y="358" style="font-size:12px" fill="var(--fg-accent)">optional: marketing opt in</text>

  <circle cx="352" cy="354" r="10" fill="var(--bg-accent-translucent)"/>
  <text x="348" y="358" style="font-size:12px" fill="var(--fg-accent)">1</text>
  <text class="sm" x="370" y="350">separate, unchecked by default,</text>
  <text class="sm" x="370" y="366">so the marketing consent holds up</text>

  <rect x="336" y="208" width="140" height="30" rx="8" fill="var(--bg-accent)"/>
  <text x="352" y="228" style="font-size:12px" fill="var(--fg-emphasis)">Claim my free inspection</text>
  <text class="sm" x="492" y="228">one submit</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 1 L7 4 L0 7" fill="none" stroke="var(--fg-secondary)"/>
    </marker>
  </defs>
</svg>
