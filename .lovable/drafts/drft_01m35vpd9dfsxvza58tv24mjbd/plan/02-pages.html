<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: var(--fg-primary); }
    .lbl { font-size: 14px; font-weight: 480; }
    .nt { font-size: 12px; fill: var(--fg-secondary); }
    .mono { font-family: var(--font-mono); font-size: 12px; fill: var(--fg-secondary); }
    .bx { fill: none; stroke: var(--fg-secondary); stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--fg-secondary)"/>
    </marker>
  </defs>

  <text class="nt" x="16" y="24">Rest of the site, unchanged</text>
  <rect class="bx" x="16" y="36" width="170" height="120" rx="8"/>
  <rect x="26" y="112" width="150" height="34" rx="8" fill="var(--bg-muted)"/>
  <text class="nt" x="101" y="133" text-anchor="middle">cookie bar</text>
  <rect x="96" y="48" width="80" height="50" rx="8" fill="var(--bg-muted)"/>
  <text class="nt" x="136" y="77" text-anchor="middle">offer card</text>
  <text class="mono" x="16" y="176">/, /services, cities</text>

  <text class="nt" x="240" y="24">Ad page and survey, clean</text>
  <rect x="240" y="36" width="170" height="120" rx="8" fill="none" stroke="var(--fg-accent)" stroke-width="1"/>
  <rect x="256" y="56" width="138" height="12" rx="6" fill="var(--border-translucent)"/>
  <rect x="256" y="76" width="110" height="12" rx="6" fill="var(--border-translucent)"/>
  <rect x="256" y="104" width="138" height="30" rx="8" fill="var(--bg-accent)"/>
  <text class="nt" x="325" y="123" text-anchor="middle" fill="var(--fg-emphasis)">one button</text>
  <text class="mono" x="240" y="176">/offer, /survey</text>

  <line x1="410" y1="96" x2="462" y2="96" stroke="var(--fg-secondary)" stroke-width="1" marker-end="url(#a)"/>

  <text class="nt" x="468" y="24">After they finish</text>
  <rect class="bx" x="468" y="36" width="156" height="120" rx="8"/>
  <text class="lbl" x="546" y="70" text-anchor="middle">Thank you</text>
  <text class="nt" x="546" y="94" text-anchor="middle">reference, next steps</text>
  <text class="nt" x="546" y="122" text-anchor="middle" fill="var(--fg-accent)">We look forward</text>
  <text class="nt" x="546" y="138" text-anchor="middle" fill="var(--fg-accent)">to serving you.</text>
  <text class="mono" x="468" y="176">/thank-you</text>
</svg>
